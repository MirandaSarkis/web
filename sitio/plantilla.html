<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miranda Sarkis</title>
<meta name="description" content="Miranda Sarkis, artista visual. Nació en La Rioja en 1994; vive y trabaja en Córdoba, Argentina.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
body{ margin:0; }
img{ max-width:100%; }
[hidden]{ display:none !important; }
/* Layout: sobria, la obra primero. Nombre + menú arriba, imagen grande, fichas en mono, textos a 62ch. */
:root{
  --bg:#f3f3f1;
  --fg:#1c1b1a;
  --muted:#6e6a66;
  --line:#d6d3cf;
  --slot:#e8e6e2;
  --font-text:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151514; --fg:#ebe9e5; --muted:#9a958f; --line:#34322f; --slot:#1f1e1c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151514; --fg:#ebe9e5; --muted:#9a958f; --line:#34322f; --slot:#1f1e1c; color-scheme:dark;
}

*, *::before, *::after{ box-sizing:border-box; }
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--font-text); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:1180px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 40px;
  display:flex; flex-direction:column; gap:48px;
  min-height:100%;
}
a{ color:inherit; }
a:focus-visible{ outline:2px solid var(--fg); outline-offset:3px; }

/* Cabecera */
header{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:14px 40px; }
.name{ font-size:clamp(22px, 3vw, 28px); font-weight:500; letter-spacing:-0.01em; text-decoration:none; }
nav ul{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px 22px; }
nav a{
  color:var(--muted); text-decoration:none; font-size:15px;
  padding-block:2px; border-bottom:1px solid transparent;
  transition:color .15s ease, border-color .15s ease;
}
nav a:hover{ color:var(--fg); }
nav a[aria-current="page"]{ color:var(--fg); border-bottom-color:var(--fg); }

/* Inicio */
.home{ display:flex; flex-direction:column; gap:20px; }
.hero{ margin:0; display:flex; flex-direction:column; gap:8px; }
.hero img{ display:block; width:100%; max-width:100%; aspect-ratio:3 / 2; object-fit:cover; background:var(--slot); }
.intro{ max-width:60ch; font-size:17px; line-height:1.5; text-wrap:pretty; margin:0; }

/* Páginas */
.page{ display:flex; flex-direction:column; gap:40px; }
.page-head{ display:flex; flex-direction:column; gap:10px; }
h1{ margin:0; font-size:clamp(26px, 4vw, 36px); font-weight:500; letter-spacing:-0.015em; line-height:1.15; text-wrap:balance; }
h1.ti{ font-weight:400; font-style:italic; }
.label{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
.block{ display:flex; flex-direction:column; gap:14px; }
.block h2{
  margin:0; font-family:var(--font-mono); font-size:11px; font-weight:400; text-transform:uppercase;
  letter-spacing:.08em; color:var(--muted); padding-bottom:8px; border-bottom:1px solid var(--line);
}
.note{ font-family:var(--font-mono); font-size:12px; color:var(--muted); margin:0; }
.back{ font-family:var(--font-mono); font-size:12px; color:var(--muted); text-decoration:none; }
.back:hover{ color:var(--fg); }

/* Listas con año */
.rows{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.rows li{ display:grid; grid-template-columns:92px minmax(0,1fr); gap:16px; }
.y{ font-family:var(--font-mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:2px; }
.rows .t{ min-width:0; max-width:72ch; }

/* Índice de muestras */
.shows{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.shows li{ border-bottom:1px solid var(--line); }
.shows li:first-child{ border-top:1px solid var(--line); }
.shows a{
  display:grid; grid-template-columns:92px minmax(0,1fr) auto; gap:16px; align-items:baseline;
  padding-block:20px; text-decoration:none;
}
.shows .ti{ font-size:clamp(19px, 2.6vw, 24px); font-style:italic; line-height:1.3; text-wrap:balance; margin:0 0 4px; }
.shows .pl{ color:var(--muted); margin:0; }
.shows .go{ font-family:var(--font-mono); font-size:13px; color:var(--muted); transition:transform .15s ease, color .15s ease; }
.shows a:hover .go{ color:var(--fg); transform:translateX(3px); }
.shows a:hover .ti{ text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:4px; }

/* Ficha de muestra */
.facts{ margin:0; display:grid; grid-template-columns:max-content minmax(0,1fr); gap:6px 20px; font-size:14px; }
.facts dt{ font-family:var(--font-mono); font-size:12px; color:var(--muted); padding-top:2px; }
.facts dd{ margin:0; min-width:0; }
.photos{
  aspect-ratio:3 / 2; max-width:100%; width:100%; background:var(--slot); border:1px dashed var(--line);
  display:grid; place-items:center; text-align:center; padding:24px; color:var(--muted); font-size:14px;
}

/* Texto largo */
.prose{ max-width:62ch; display:flex; flex-direction:column; gap:1em; font-size:16px; line-height:1.65; }
.prose p{ margin:0; text-wrap:pretty; }
.prose .sub{ font-style:italic; color:var(--muted); }
.prose .epi{ font-style:italic; color:var(--muted); padding-left:1.2em; border-left:1px solid var(--line); }
.prose .sig{ font-family:var(--font-mono); font-size:13px; color:var(--muted); }
.prose ol{ margin:0; padding-left:1.6em; display:flex; flex-direction:column; gap:1em; }
.prose ol li::marker{ font-family:var(--font-mono); font-size:13px; color:var(--muted); }

/* Prensa */
.press{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.press li{ border-bottom:1px solid var(--line); }
.press li:first-child{ border-top:1px solid var(--line); }
.press a{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 24px; padding-block:16px; text-decoration:none; }
.press .med{ font-family:var(--font-mono); font-size:12px; color:var(--muted); grid-column:1 / -1; }
.press .hl{ min-width:0; max-width:70ch; }
.press .go{ font-family:var(--font-mono); font-size:13px; color:var(--muted); }
.press a:hover .hl{ text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:4px; }

.contact{ margin:0; font-size:clamp(18px, 2.4vw, 22px); user-select:all; }
.contact a{ text-decoration:none; border-bottom:1px solid var(--line); }
.contact a:hover{ border-bottom-color:var(--fg); }
.links{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.links a{ text-underline-offset:3px; text-decoration-thickness:1px; }

/* Galería */
.gallery{ display:flex; flex-direction:column; gap:16px; }
.shot{ display:block; width:100%; padding:0; margin:0; border:0; background:var(--slot); cursor:zoom-in; }
.shot img{ display:block; width:100%; height:auto; max-width:100%; transition:opacity .2s ease; }
.shot:hover img{ opacity:.92; }
.shot:focus-visible{ outline:2px solid var(--fg); outline-offset:3px; }
.cols{ columns:2; column-gap:16px; }
.cols .shot{ break-inside:avoid; margin-bottom:16px; }

/* Visor */
.box{
  position:fixed; inset:0; z-index:50; background:var(--bg);
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.box[hidden]{ display:none; }
.box .stage{ flex:1; min-height:0; position:relative; }
.box .stage img{ position:absolute; top:16px; left:0; width:100%; height:calc(100% - 24px); max-width:none; object-fit:contain; }
.box .count{ min-width:0; overflow-wrap:anywhere; }
.box .bar{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding-block:12px 16px; border-top:1px solid var(--line); }
.box .count{ font-family:var(--font-mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.box .ctrls{ display:flex; gap:8px; }
.box button{
  font:inherit; font-size:14px; color:var(--fg); background:transparent; cursor:pointer;
  border:1px solid var(--line); padding:8px 14px; min-width:44px;
}
.box button:hover{ border-color:var(--fg); }
.box button:focus-visible{ outline:2px solid var(--fg); outline-offset:2px; }

/* Obras */
.tabs{ display:flex; flex-wrap:wrap; gap:8px; }
.tab{ font-size:14px; text-decoration:none; color:var(--muted); border:1px solid var(--line); padding:6px 14px; }
.tab:hover{ color:var(--fg); border-color:var(--fg); }
.tab[aria-current]{ color:var(--bg); background:var(--fg); border-color:var(--fg); }
.works{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:36px 20px; }
.works a{ display:flex; flex-direction:column; gap:6px; text-decoration:none; }
.works .thumb{ display:block; aspect-ratio:1 / 1; max-width:100%; overflow:hidden; background:var(--slot); margin-bottom:6px; }
.works .thumb img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease; }
.works a:hover .thumb img{ transform:scale(1.02); }
.works .wt{ font-style:italic; font-size:17px; line-height:1.3; text-wrap:balance; }
.works .wm{ font-family:var(--font-mono); font-size:12px; color:var(--muted); }
.works-g{ columns:auto; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:28px 20px; align-items:start; }
.piece{ margin:0; min-width:0; display:flex; flex-direction:column; gap:6px; }
.piece .shot{ margin:0; }
.piece figcaption{ font-family:var(--font-mono); font-size:12px; color:var(--muted); }
.bio-top{ display:grid; grid-template-columns:minmax(0, 300px) minmax(0, 1fr); gap:40px; align-items:start; }
.portrait{ margin:0; display:flex; flex-direction:column; gap:8px; }
.portrait img{ display:block; width:100%; height:auto; max-width:100%; background:var(--slot); }
@media (max-width:760px){ .bio-top{ grid-template-columns:1fr; gap:28px; } .portrait{ max-width:340px; } }
.gal{ display:flex; flex-direction:column; gap:2px; }
.gal p{ margin:0; }
.gal .gname{ font-size:clamp(18px, 2.4vw, 22px); margin-bottom:6px; }
.gal a{ text-underline-offset:3px; text-decoration-thickness:1px; }
@media (max-width:900px){ .works{ grid-template-columns:repeat(2, minmax(0,1fr)); } .works-g{ grid-template-columns:repeat(2, minmax(0,1fr)); } }

/* Videos */
.videos{ display:flex; flex-direction:column; gap:20px; }
.video{ margin:0; display:flex; flex-direction:column; gap:8px; }
.video video{ display:block; width:100%; height:auto; max-width:100%; background:#000; }
.video.vertical{ align-items:center; }
.video.vertical video{ width:auto; max-height:80vh; }
.video.embed iframe{ width:100%; aspect-ratio:16 / 9; border:0; background:#000; }

footer{
  margin-top:auto; padding-top:20px; border-top:1px solid var(--line);
  display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 24px;
  font-size:13px; color:var(--muted);
}

@media (max-width:560px){
  .wrap{ gap:36px; padding-block:20px 32px; }
  header{ flex-direction:column; align-items:flex-start; }
  .intro{ font-size:16px; }
  .rows li{ grid-template-columns:1fr; gap:2px; }
  .shows a{ grid-template-columns:1fr; gap:4px; }
  .shows .go{ display:none; }
  .facts{ grid-template-columns:1fr; gap:0; }
  .facts dd{ margin-bottom:8px; }
  .cols{ columns:1; }
  .works-g{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:20px 12px; }
  .works{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="name" href="#">Miranda Sarkis</a>
    <nav aria-label="Secciones">
      <ul>
        <li><a href="#muestras">Muestras</a></li>
        <li><a href="#obras">Obras</a></li>
        <li><a href="#textos">Textos</a></li>
        <li><a href="#prensa">Prensa</a></li>
        <li><a href="#bio">Bio / CV</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main id="view"></main>

  <footer>
    <span>Miranda Sarkis · La Rioja, Argentina</span>
    <span>Representada por Luogo Galería</span>
  </footer>
</div>

<div id="box" class="box" hidden role="dialog" aria-modal="true" aria-label="Visor de fotos">
  <div class="stage"><img alt=""></div>
  <div class="bar">
    <span class="count"></span>
    <div class="ctrls">
      <button type="button" class="prev" aria-label="Foto anterior">←</button>
      <button type="button" class="next" aria-label="Foto siguiente">→</button>
      <button type="button" class="close" aria-label="Cerrar">Cerrar</button>
    </div>
  </div>
</div>

<script>
/* ---------- Contenido (lo genera sitio/construir.py) ---------- */
/*__DATOS__*/

/* ---------- Render ---------- */

const view = document.getElementById("view");
const navLinks = document.querySelectorAll("nav a");

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === "html") n.innerHTML = attrs[k];
    else if (k === "class") n.className = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  kids.flat(Infinity).forEach(k => { if (k != null) n.append(k); });
  return n;
}
const paras = arr => arr.map(t => el("p", null, t));

function home(){
  const ini = SITIO.inicio, p = ini.portada;
  return el("section", {class:"home"},
    p ? el("figure", {class:"hero"},
      el("img", {src:p[0], alt:ini.alt, width:String(p[1]), height:String(p[2])}),
      ini.registro ? el("figcaption", {class:"note credit"}, "Registro: " + ini.registro) : null
    ) : null,
    ini.intro ? el("p", {class:"intro"}, ini.intro) : null
  );
}

function muestras(){
  return el("section", {class:"page"},
    el("h1", null, "Muestras"),
    el("div", {class:"block"},
      el("h2", null, "Individuales"),
      el("ul", {class:"shows"}, MUESTRAS.map(m =>
        el("li", null, el("a", {href:"#" + m.id},
          el("span", {class:"y"}, m.anio),
          el("div", null, el("p", {class:"ti"}, m.titulo), el("p", {class:"pl"}, m.lugar)),
          el("span", {class:"go", "aria-hidden":"true"}, "→")
        ))
      ))
    )
  );
}

function muestra(m){
  const facts = el("dl", {class:"facts"},
    el("dt", null, "Año"), el("dd", null, m.anio),
    el("dt", null, "Lugar"), el("dd", null, m.lugar),
    m.ficha.map(([k, v]) => [el("dt", null, k), el("dd", null, v)])
  );
  let prose = null;
  if (m.texto || m.pasajes){
    prose = el("div", {class:"prose"},
      m.subtitulo ? el("p", {class:"sub"}, m.subtitulo) : null,
      m.epigrafe ? el("p", {class:"epi"}, m.epigrafe) : null,
      m.texto ? paras(m.texto) : null,
      m.pasajes ? el("ol", null, m.pasajes.map(t => el("li", null, t))) : null,
      m.firma ? el("p", {class:"sig"}, m.firma) : null
    );
  }
  return el("section", {class:"page"},
    el("a", {class:"back", href:"#muestras"}, "← Muestras"),
    el("div", {class:"page-head"}, el("h1", {class:"ti"}, m.titulo)),
    facts,
    videos(m),
    gallery(m),
    prose
  );
}

function videos(m){
  const vs = (m.videos || []).map(v => el("figure", {class:"video" + (v[3] > v[2] ? " vertical" : "")},
    el("video", Object.assign({src:v[0], controls:"", playsinline:"", preload:"metadata", width:String(v[2]), height:String(v[3])}, v[1] ? {poster:v[1]} : {})),
    v[4] ? el("figcaption", {class:"note"}, v[4]) : null
  ));
  if (m.embed){
    const u = m.embed;
    let src = null;
    let k = u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{6,})/); if (k) src = "https://www.youtube-nocookie.com/embed/" + k[1];
    k = u.match(/vimeo\.com\/(?:video\/)?(\d+)/); if (k) src = "https://player.vimeo.com/video/" + k[1];
    if (src) vs.push(el("figure", {class:"video embed"}, el("iframe", {src, title:"Video de " + m.titulo, allow:"fullscreen; picture-in-picture", allowfullscreen:"", loading:"lazy"})));
  }
  return vs.length ? el("div", {class:"videos"}, vs) : null;
}

function gallery(m){
  const list = FOTOS[m.id] || [];
  if (!list.length) return el("div", {class:"photos"}, "Fotos de sala en preparación");
  const alt = i => m.titulo + ", vista " + (i + 1) + " de " + list.length;
  const fig = (f, i, cls) => el("button", {class:"shot " + (cls || ""), type:"button", "aria-label":"Ampliar " + alt(i), "data-i":String(i)},
    el("img", {src:f[0], width:String(f[1]), height:String(f[2]), alt:alt(i), loading: i < 2 ? "eager" : "lazy", decoding:"async"})
  );
  const g = el("div", {class:"gallery"},
    fig(list[0], 0, "lead"),
    el("div", {class:"cols"}, list.slice(1).map((f, j) => fig(f, j + 1)))
  );
  g.addEventListener("click", e => {
    const b = e.target.closest(".shot"); if (b) openBox(list, +b.dataset.i, m.titulo, b);
  });
  return g;
}

/* Visor de fotos */
const box = document.getElementById("box");
const boxImg = box.querySelector("img");
const boxCount = box.querySelector(".count");
let boxList = [], boxI = 0, boxTitle = "", boxReturn = null;
function showBox(){
  const f = boxList[boxI];
  boxImg.src = f[0]; boxImg.alt = boxTitle + ", vista " + (boxI + 1) + " de " + boxList.length;
  boxCount.textContent = (boxI + 1) + " / " + boxList.length + (f[3] ? "  ·  " + f[3] : "");
  if (f[3]) boxImg.alt = f[3];
}
function openBox(list, i, title, from){
  boxList = list; boxI = i; boxTitle = title; boxReturn = from;
  showBox(); box.hidden = false; document.body.style.overflow = "hidden";
  box.querySelector(".close").focus();
}
function closeBox(){
  box.hidden = true; document.body.style.overflow = "";
  if (boxReturn) boxReturn.focus();
}
function stepBox(d){ boxI = (boxI + d + boxList.length) % boxList.length; showBox(); }
box.querySelector(".close").addEventListener("click", closeBox);
box.querySelector(".prev").addEventListener("click", () => stepBox(-1));
box.querySelector(".next").addEventListener("click", () => stepBox(1));
box.addEventListener("click", e => { if (e.target === box || e.target.classList.contains("stage")) closeBox(); });
document.addEventListener("keydown", e => {
  if (box.hidden) return;
  if (e.key === "Escape") closeBox();
  if (e.key === "ArrowLeft") stepBox(-1);
  if (e.key === "ArrowRight") stepBox(1);
});

function textos(){
  return el("section", {class:"page"},
    el("h1", null, "Textos"),
    el("div", {class:"block"},
      el("h2", null, "Statement"),
      el("div", {class:"prose"}, paras(STATEMENT))
    ),
    el("div", {class:"block"},
      el("h2", null, "Textos de muestras"),
      el("ul", {class:"links"}, MUESTRAS.filter(m => m.firma).map(m =>
        el("li", null, el("a", {href:"#" + m.id}, m.firma.split(",")[0] + ", sobre "), el("em", null, m.titulo), " (" + m.anio + ")")
      ))
    )
  );
}

function prensa(){
  return el("section", {class:"page"},
    el("h1", null, "Prensa"),
    el("ul", {class:"press"}, PRENSA.map(([med, hl, url]) =>
      el("li", null, el("a", {href:url, target:"_blank", rel:"noopener"},
        el("span", {class:"med"}, med),
        el("span", {class:"hl"}, hl),
        el("span", {class:"go", "aria-hidden":"true"}, "↗")
      ))
    ))
  );
}

function bio(){
  return el("section", {class:"page"},
    el("h1", null, "Bio / CV"),
    el("div", {class:"bio-top"},
      SITIO.retrato ? el("figure", {class:"portrait"},
        el("img", {src:SITIO.retrato[0], width:String(SITIO.retrato[1]), height:String(SITIO.retrato[2]), alt:"Retrato de Miranda Sarkis"}),
        SITIO.pie_retrato ? el("figcaption", {class:"note"}, SITIO.pie_retrato) : null
      ) : null,
      el("div", {class:"block"},
        el("h2", null, "Bio"),
        el("div", {class:"prose"}, paras(BIO))
      )
    ),
    CV.map(([h, rows]) => el("div", {class:"block"},
      el("h2", null, h),
      el("ul", {class:"rows"}, rows.map(([y, t]) => el("li", null, el("span", {class:"y"}, y), el("span", {class:"t", html:t}))))
    ))
  );
}

function pendiente(titulo, desc){
  return el("section", {class:"page"},
    el("div", {class:"page-head"},
      el("span", {class:"label"}, "En preparación"),
      el("h1", null, titulo),
      el("p", {class:"note"}, desc)
    )
  );
}

function obrasIndex(cat){
  const list = cat ? OBRAS.filter(o => o.cat === cat) : OBRAS;
  const tab = (href, label, on) => el("a", {class:"tab", href, ...(on ? {"aria-current":"true"} : {})}, label);
  return el("section", {class:"page"},
    el("h1", null, "Obras"),
    el("nav", {class:"tabs", "aria-label":"Filtrar por técnica"},
      tab("#obras", "Todas", !cat),
      Object.keys(CATS).map(k => tab("#obras-" + k, CATS[k], cat === k))
    ),
    el("ul", {class:"works"}, list.map(o =>
      el("li", null, el("a", {href:"#" + o.id},
        el("span", {class:"thumb"}, el("img", {src:o.cover, alt:o.titulo, loading:"lazy", decoding:"async"})),
        el("span", {class:"wt"}, o.titulo),
        el("span", {class:"wm"}, CATS[o.cat] + " · " + o.anio)
      ))
    ))
  );
}

function obra(o){
  const g = el("div", {class:"cols works-g"}, o.items.map((f, i) =>
    el("figure", {class:"piece"},
      el("button", {class:"shot", type:"button", "aria-label":"Ampliar " + f[3], "data-i":String(i)},
        el("img", {src:f[0], width:String(f[1]), height:String(f[2]), alt:f[3], loading: i < 4 ? "eager" : "lazy", decoding:"async"})
      ),
      f[5] ? el("figcaption", null, f[3].split(" · ")[0]) : null
    )
  ));
  g.addEventListener("click", e => {
    const b = e.target.closest(".shot"); if (b) openBox(o.items, +b.dataset.i, o.titulo, b);
  });
  return el("section", {class:"page"},
    el("a", {class:"back", href:"#obras-" + o.cat}, "← " + CATS[o.cat]),
    el("div", {class:"page-head"}, el("h1", {class:"ti"}, o.titulo)),
    el("dl", {class:"facts"},
      o.nota ? [el("dt", null, "Formato"), el("dd", null, o.nota)] : null,
      el("dt", null, "Técnica"), el("dd", null, o.tec),
      el("dt", null, "Medidas"), el("dd", null, o.med),
      el("dt", null, "Año"), el("dd", null, o.anio),
      o.registro ? [el("dt", null, "Registro"), el("dd", null, o.registro)] : null
    ),
    o.texto ? el("div", {class:"prose"}, paras(o.texto)) : null,
    g
  );
}

function enlazar(t){
  const p = el("span");
  const re = /([\w.+-]+@[\w-]+\.[\w.]+)|((?:https?:\/\/|www\.)\S+)|(@[\w.]+)|(\+?\d[\d\s-]{7,}\d)/g;
  let last = 0, m;
  while ((m = re.exec(t))){
    p.append(t.slice(last, m.index));
    const s = m[0];
    let href = m[1] ? "mailto:" + s : m[2] ? (s.startsWith("http") ? s : "https://" + s) : m[3] ? "https://instagram.com/" + s.slice(1) : "tel:" + s.replace(/[^\d+]/g, "");
    const a = el("a", {href}, s);
    if (m[2] || m[3]){ a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener"); }
    p.append(a); last = m.index + s.length;
  }
  p.append(t.slice(last));
  return p;
}

function contacto(){
  return el("section", {class:"page"},
    el("h1", null, "Contacto"),
    SITIO.contacto.map(b => el("div", {class:"block"},
      el("h2", null, b.titulo),
      b.lineas.length === 1
        ? el("p", {class:"contact"}, enlazar(b.lineas[0]))
        : el("div", {class:"gal"}, b.lineas.map((l, i) => el("p", i === 0 ? {class:"gname"} : null, enlazar(l))))
    ))
  );
}

const ROUTES = {
  muestras, textos, prensa, bio, contacto,
  obras: () => obrasIndex(null),
  "obras-ceramica": () => obrasIndex("ceramica"),
  "obras-dibujo": () => obrasIndex("dibujo")
};

function render(){
  if (!box.hidden) closeBox();
  const key = (location.hash || "").replace("#", "");
  const m = MUESTRAS.find(x => x.id === key);
  const o = OBRAS.find(x => x.id === key);
  view.innerHTML = "";
  view.append(m ? muestra(m) : o ? obra(o) : ROUTES[key] ? ROUTES[key]() : home());
  const navKey = m ? "muestras" : (o || key.startsWith("obras")) ? "obras" : key;
  navLinks.forEach(a => a.toggleAttribute("aria-current", a.getAttribute("href") === "#" + navKey));
  navLinks.forEach(a => { if (a.hasAttribute("aria-current")) a.setAttribute("aria-current", "page"); });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
